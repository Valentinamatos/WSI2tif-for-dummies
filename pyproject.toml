[build-system]
requires = ["setuptools>=75.8.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "WSI2tif_for_dummies"
version = "0.1.0"
description = "Easy to use WSI2tif for all those coding-elite wannabes."
authors = [
    {name = "Valentina Matos-Romero"}
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "numpy>=1.23.5",
    "pillow==10.4.0",
    "setuptools==75.8.2",
    "openslide-python==1.3.1",
    "jupyter==1.1.1",
    "matplotlib==3.7.2",
    "openslide-bin",
]

[project.urls]
Homepage = "https://github.com/Valentinamatos/WSI2tif-for-dummies"

[tool.setuptools]
packages = "find:"

[tool.setuptools.package-data]
"" = ["*.ipynb", "*.qss"]